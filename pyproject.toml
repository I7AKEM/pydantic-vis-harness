[project]
name = "pydantic-vis-harness"
version = "0.1.0"
description = "Pydantic AI chat with CSV profiling through DuckDB and OpenRouter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "logfire>=5.0.0",
    "pydantic-ai-harness[code-mode]>=0.28.1",
    "pydantic-ai-slim[cli,openrouter,temporal,web]>=2.38.0",
    "pydantic-evals>=2.38.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
